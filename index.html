<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>레드카펫</title>
<style>
  :root { --ink: #1b2233; --sub: #5e6577; --line: #e3e5ec; --bg: #ffffff; --night: #172036; }
  @media (prefers-color-scheme: dark) { :root { --ink: #eef0f5; --sub: #a3aab9; --line: #2a3349; --bg: #0e1322; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.75 system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
  header { background: var(--night); color: #f1f2f6; padding: 28px 16px; }
  header p { margin: 0; opacity: .75; font-size: 14px; }
  main, header > div { max-width: 720px; margin: 0 auto; }
  main { padding: 8px 16px 48px; }
  h1 { font-size: 26px; margin: 4px 0 0; line-height: 1.35; }
  h2 { font-size: 19px; margin: 32px 0 8px; }
  p, li { color: var(--ink); }
  .table { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { color: var(--sub); font-weight: 600; }
  a { color: inherit; }
</style>
</head>
<body><header><div><h1>레드카펫</h1></div></header><main><ul><li><a href="dream/privacy/">꿈해몽 개인정보처리방침</a></li></ul><p>문의: red.carpet.kor@gmail.com</p></main></body>
</html>
